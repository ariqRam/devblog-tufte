<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ariq's Blog</title>
  <link rel="stylesheet" href="./css/tufte.css"/>
  <style>
    /* Minimalist Navbar matching Tufte proportions */
    header.site-header {
      width: 87.5%;
      margin: 0 auto;
      padding-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header.site-header a {
      color: inherit;
      text-decoration: none;
      background: none;
    }
    header.site-header .brand {
      font-size: 1.4rem;
      font-weight: normal;
    }

		/* Control logo sizing and alignment */
		header.site-header .brand img {
			height: 22px;              /* Adjust height to balance with nav link font size */
			width: auto;               /* Keeps original aspect ratio */
			display: block;            /* Removes phantom bottom inline spacing */
			object-fit: contain;
		}

    header.site-header nav a {
      margin-left: 1.5rem;
      font-size: 1.1rem;
    }
    header.site-header nav a:hover {
      text-decoration: underline;
    }
    @media (max-width: 760px) {
      header.site-header {
        width: 90%;
        padding-top: 1rem;
      }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="./index.html" class="brand">
		<img src="./images/logo.png" alt="site logo"/>
	</a>
  <nav>
    <a href="./posts.html">Posts</a>
  </nav>
</header>

<article>
  <h1>Ariq's Blog</h1>
  <p class="subtitle"></p>
  <section>
<p>I love human languages, and the technology behind modeling them. I'm currently researching how language models process orthographic difference, specifically between Japanese kana and kanji<label for="sn-1" class="margin-toggle sidenote-number"></label><input type="checkbox" id="sn-1" class="margin-toggle"/><span class="sidenote">Japan adopts <a href="https://en.wikipedia.org/wiki/Japanese_writing_system">three writing systems</a></span>.</p>

</section>
</article>

</body>
</html>
